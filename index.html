<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>손 씻기 넛지(Nudge) 실험</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f5f6fa; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; overflow-x: hidden; padding: 20px; box-sizing: border-box; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 8px; margin-top: 10px; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; font-size: 15px; font-weight: 500; }
        
        .soap-container { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .soap-bottle { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.1s; }
        .soap-bottle:active { transform: scale(0.92); }
        
        .soap-bottle img { width: 150px; height: 195px; object-fit: cover; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); margin-bottom: 12px; border: 4px solid transparent; transition: border-color 0.3s, transform 0.1s, box-shadow 0.3s; }
        .normal-soap img { border-color: #bdc3c7; }
        .nudge-soap img { border-color: #e74c3c; }
        .soap-label { font-size: 16px; font-weight: 900; color: #2c3e50; background: white; padding: 6px 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border: 2px solid #e2e8f0; pointer-events: none; }
        .nudge-soap .soap-label { color: #e74c3c; border-color: #fadbd8; }
        
        #thank-you-msg { display: none; font-size: 17px; font-weight: bold; color: #2980b9; margin-bottom: 30px; background: #ebf5fb; padding: 16px 32px; border-radius: 12px; border-left: 5px solid #3498db; }
        
        /* 항상 보이는 통계 패널 스타일 */
        #stats-panel { width: 100%; max-width: 400px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 2px solid #e2e8f0; box-sizing: border-box; }
        .bar-chart { width: 100%; background: #ecf0f1; border-radius: 10px; margin: 10px 0; overflow: hidden; height: 32px; position: relative; }
        .bar { height: 100%; display: flex; align-items: center; padding-left: 10px; color: white; font-weight: bold; transition: width 0.3s ease-out; white-space: nowrap; }
        .bar-normal { background-color: #7f8c8d; width: 0%; }
        .bar-nudge { background-color: #e74c3c; width: 0%; }
        
        @keyframes pop { 0% { transform: scale(0.92); opacity: 0.8; } 50% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    </style>
    
    <!-- 파이어베이스 스크립트 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <h1>손을 씻고 입장해 주세요!</h1>
    <p class="subtitle">어느 소독제를 사용하시겠습니까? (거품 짜기 펌핑!)</p>
    
    <div class="soap-container">
        <div class="soap-bottle normal-soap" onclick="vote('normal')">
            <img src="https://cdn.phototourl.com/member/2026-10-12-59e0f464-bd3c-4a97-a20e-ec9d4aec343a.png" alt="기존 아이깨끗해">
            <span class="soap-label">아이깨끗해</span>
        </div>
        <div class="soap-bottle nudge-soap" onclick="vote('nudge')">
            <img src="https://i.postimg.cc/qq5XJp49/Gemini-Generated-Image-jwvnlqjwvnlqjwvn.png" alt="빨간색 아이깨끗해">
            <span class="soap-label">아이깨끗해</span>
        </div>
    </div>
    
    <div id="thank-you-msg"></div>
    
    <!-- 항상 보이는 실시간 통계 패널 (비밀번호 없음) -->
    <div id="stats-panel">
        <h3 style="margin-top:0; color:#2c3e50; font-weight: 900;">📊 실시간 펌핑 현황</h3>
        <p style="margin-bottom: 5px; font-size: 14px; text-align: left; font-weight: bold; color: #5a626a;">기존 아이깨끗해 (일반)</p>
        <div class="bar-chart"><div id="bar-normal" class="bar bar-normal">0</div></div>
        <p style="margin-bottom: 5px; font-size: 14px; text-align: left; margin-top: 15px; font-weight: bold; color: #e74c3c;">빨간색 아이깨끗해 (넛지)</p>
        <div class="bar-chart"><div id="bar-nudge" class="bar bar-nudge">0</div></div>
        <p id="total-votes" style="margin-top: 15px; font-size: 14px; font-weight: bold; color: #2c3e50;">총 펌핑 횟수: 0번</p>
    </div>

    <script>
        // 파이어베이스 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAy0s3n95UDTQCZonaDtxb2Jl4OejfMyuk",
            authDomain: "nudge-2c23e.firebaseapp.com",
            databaseURL: "https://nudge-2c23e-default-rtdb.firebaseio.com",
            projectId: "nudge-2c23e",
            storageBucket: "nudge-2c23e.firebasestorage.app",
            messagingSenderId: "612578790471",
            appId: "1:612578790471:web:fbf8438a8491c525c67562",
            measurementId: "G-7N13919YKE"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myPumps = 0;

        // 누군가 투표하면 '실시간으로' 그래프가 갱신되는 마법의 리스너
        db.ref('votes').on('value', (snapshot) => {
            let data = snapshot.val() || { normal: 0, nudge: 0 };
            let normal = data.normal || 0;
            let nudge = data.nudge || 0;
            let total = normal + nudge;

            if (total === 0) {
                document.getElementById('bar-normal').style.width = '0%';
                document.getElementById('bar-normal').innerText = '0번';
                document.getElementById('bar-nudge').style.width = '0%';
                document.getElementById('bar-nudge').innerText = '0번';
                document.getElementById('total-votes').innerText = "총 펌핑 횟수: 0번";
                return;
            }

            let normalPercent = Math.round((normal / total) * 100);
            let nudgePercent = Math.round((nudge / total) * 100);

            document.getElementById('bar-normal').style.width = normalPercent + '%';
            document.getElementById('bar-normal').innerText = normal + '번 (' + normalPercent + '%)';

            document.getElementById('bar-nudge').style.width = nudgePercent + '%';
            document.getElementById('bar-nudge').innerText = nudge + '번 (' + nudgePercent + '%)';
            
            document.getElementById('total-votes').innerText = "총 펌핑 횟수: " + (normal + nudge) + "번";
        });

        // 투표 버튼 클릭 시 실행
        window.vote = function(type) {
            let dbRef = db.ref('votes/' + type);
            
            dbRef.transaction((currentVotes) => {
                return (currentVotes || 0) + 1;
            }).then(() => {
                myPumps++;
                let msgBox = document.getElementById('thank-you-msg');
                msgBox.style.display = 'block';
                msgBox.innerHTML = "🫧 <b>" + myPumps + "번</b> 펌핑하셨습니다!";
                msgBox.style.animation = 'none'; 
                setTimeout(() => { msgBox.style.animation = 'pop 0.3s ease-out'; }, 10);
            });
        }
    </script>
</body>
</html>
